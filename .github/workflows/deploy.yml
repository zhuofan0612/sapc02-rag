name: deploy
on:
  push: { branches: [main] }
permissions:
  id-token: write
  contents: read
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/github-oidc-deploy
          aws-region: eu-north-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build & push
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/sapc02-rag:latest
          docker build -t $IMG .
          docker push $IMG
      - name: Force new deployment
        run: aws ecs update-service --cluster sapc02-rag --service sapc02-rag --force-new-deployment
